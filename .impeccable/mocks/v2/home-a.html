<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시안 A · 풀스크린 포스터 무대</title><link rel="stylesheet" href="base.css">
<style>
.stage{position:relative;height:min(92vh,820px);min-height:560px;margin-top:-64px;overflow:hidden;background:#0c0d12;color:#fff}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}
.slide.on{opacity:1}
.slide .bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(36px) brightness(.45);transform:scale(1.1)}
.slide .poster{position:absolute;right:clamp(16px,6vw,100px);top:50%;transform:translateY(-44%);max-height:70%;max-width:50%;border-radius:10px;box-shadow:0 40px 80px -20px rgba(0,0,0,.7)}
.copy{position:absolute;left:clamp(16px,5vw,72px);bottom:clamp(40px,10vh,110px);max-width:560px}
.eyebrow{font-size:13px;letter-spacing:.14em;color:rgba(255,255,255,.7);font-weight:700}
.big{font-size:clamp(76px,11vw,168px);line-height:.85;margin:14px 0 18px}
.title{font-size:clamp(26px,3.2vw,44px);font-weight:800;letter-spacing:-.035em;line-height:1.15;margin:0}
.place{margin:10px 0 28px;color:rgba(255,255,255,.75);font-size:16px}
.ctrl{position:absolute;left:clamp(16px,5vw,72px);right:clamp(16px,5vw,72px);bottom:24px;display:flex;gap:8px}
.bar{flex:1;height:3px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden;border:0;padding:0;cursor:pointer}
.bar i{display:block;height:100%;width:0;background:#fff}
.bar.on i{animation:fill 5s linear forwards}.bar.done i{width:100%}
@keyframes fill{to{width:100%}}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);gap:16px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.rail .tk{scroll-snap-align:start}
.intro{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;margin-top:72px;align-items:end}
.intro h1{font-size:clamp(30px,4vw,52px);letter-spacing:-.04em;line-height:1.1;margin:0}
.intro p{color:var(--ink-2);line-height:1.7;margin:0}
@media(max-width:720px){.stage{height:86vh}.slide .poster{right:50%;top:90px;transform:translateX(50%);max-width:calc(100% - 32px);max-height:34%}.copy{bottom:72px}.intro{grid-template-columns:1fr;gap:12px}}
</style></head><body>
<nav class="nav on-dark"><a class="logo" href="#">YuhanCon</a><div class="menu"><a aria-current="page">홈</a><a>공연 정보</a><a>게시판</a><a>마이페이지</a></div><div class="acct"><a>로그인</a><a>회원가입</a></div><svg class="burger" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></nav>
<section class="stage" id="stage"></section>
<div class="wrap">
  <div class="intro"><h1>오늘 밤, 가까운 무대로.</h1><p>학교 공연부터 버스킹·콘서트까지 한곳에서 찾고, 원하는 자리를 골라 예매하세요. 같이 갈 사람은 게시판에서 구할 수 있습니다.</p></div>
  <div class="sec-head"><h2 class="sec">다가오는 공연</h2><a href="#">전체 보기 →</a></div>
  <div class="rail" id="rail"></div>
</div>
<footer class="foot"><b>YuhanCon.</b> 학교 공연부터 버스킹·콘서트까지, 가까운 무대를 찾고 예매하는 공연 플랫폼<br>함께 갈 사람은 게시판에서 찾아보세요.</footer>
<div class="tag">시안 A · 풀스크린 포스터 무대</div>
<script src="data.js"></script>
<script>
const st=document.getElementById('stage');
st.innerHTML=SHOWS.slice(0,4).map((s,i)=>`<div class="slide${i?'':' on'}"><div class="bg" style="background-image:url(${s.img})"></div><img class="poster" src="${s.img}" alt=""><div class="copy"><div class="eyebrow">${s.cat} · 예매 중</div><div class="big num">${s.d}</div><h2 class="title">${s.t}</h2><p class="place">${s.p}</p><a class="btn">예매하기</a></div></div>`).join('')+`<div class="ctrl">${SHOWS.slice(0,4).map((_,i)=>`<button class="bar${i?'':' on'}" aria-label="${i+1}번 슬라이드"><i></i></button>`).join('')}</div>`;
let cur=0,timer;const sl=st.querySelectorAll('.slide'),bars=st.querySelectorAll('.bar');
function go(n){sl[cur].classList.remove('on');cur=(n+sl.length)%sl.length;sl[cur].classList.add('on');bars.forEach((b,i)=>{b.classList.remove('on','done');void b.offsetWidth;if(i<cur)b.classList.add('done');if(i==cur)b.classList.add('on')});clearTimeout(timer);timer=setTimeout(()=>go(cur+1),5000)}
bars.forEach((b,i)=>b.onclick=()=>go(i));timer=setTimeout(()=>go(1),5000);
document.getElementById('rail').innerHTML=SHOWS.map(TK).join('');
</script></body></html>
