<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시안 B · 카운트다운 전광판</title><link rel="stylesheet" href="base.css">
<style>
.hero{display:grid;grid-template-columns:1fr 1.05fr;gap:clamp(24px,4vw,64px);align-items:center;padding:24px clamp(16px,5vw,72px) 0;min-height:min(78vh,700px)}
.board{background:var(--ink);color:#fff;border-radius:22px;padding:clamp(24px,3vw,40px);position:relative;overflow:hidden}
.board::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.06) 1px,transparent 1.4px) 0 0/8px 8px;pointer-events:none}
.lbl{font-size:13px;letter-spacing:.14em;color:rgba(255,255,255,.6);font-weight:700}
.dd{font-size:clamp(110px,15vw,220px);line-height:.82;margin:18px 0 22px;color:#fff}
.dd span{color:#8FA0FF}
.bt{font-size:clamp(24px,2.6vw,36px);font-weight:800;letter-spacing:-.03em;margin:0}
.bp{color:rgba(255,255,255,.7);margin:8px 0 28px}
.flip{display:flex;gap:8px;margin-bottom:28px}
.flip div{background:#22252e;border-radius:8px;padding:10px 12px;text-align:center;min-width:64px}
.flip b{display:block;font-size:30px;line-height:1}.flip small{font-size:11px;color:rgba(255,255,255,.55)}
.show{position:relative;aspect-ratio:4/5;border-radius:22px;overflow:hidden;background:#111}
.show .bg{position:absolute;inset:-30px;background-size:cover;filter:blur(28px) brightness(.5)}
.show img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .8s}
.dots{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:8px}
.dots i{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.4)}.dots i.on{width:28px;background:#fff}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.day{background:var(--paper);border-radius:14px;padding:14px;min-height:150px;border:1px solid transparent}
.day.has{border-color:var(--accent)}
.day .dn{font-size:13px;color:var(--ink-3)}.day .dd2{font-size:28px;line-height:1;margin:4px 0 10px}
.day .ev{font-size:13px;font-weight:700;line-height:1.35;color:var(--accent)}
@media(max-width:820px){.hero{grid-template-columns:1fr}.show{aspect-ratio:1/1}.week{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:120px;overflow-x:auto}}
</style></head><body>
<nav class="nav"><a class="logo">YuhanCon</a><div class="menu"><a aria-current="page">홈</a><a>공연 정보</a><a>게시판</a><a>마이페이지</a></div><div class="acct"><a>로그인</a><a>회원가입</a></div><svg class="burger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></nav>
<section class="hero">
  <div class="board">
    <div class="lbl">다음 무대까지</div>
    <div class="dd num">D<span>-</span>3</div>
    <h1 class="bt">aespa LIVE TOUR – SYNK</h1>
    <p class="bp">12월 20일 토요일 · KSPO DOME</p>
    <div class="flip"><div><b class="num">02</b><small>일</small></div><div><b class="num">14</b><small>시간</small></div><div><b class="num">37</b><small>분</small></div><div><b class="num">08</b><small>초</small></div></div>
    <a class="btn">자리 고르고 예매하기</a>
  </div>
  <div class="show"><div class="bg" style="background-image:url(../../../YuhanCon/src/main/resources/static/images/aespa.jpg)"></div><img src="../../../YuhanCon/src/main/resources/static/images/aespa.jpg" alt=""><div class="dots"><i class="on"></i><i></i><i></i><i></i></div></div>
</section>
<div class="wrap">
  <div class="sec-head"><h2 class="sec">이번 주 무대</h2><a>공연 정보 전체 →</a></div>
  <div class="week" id="wk"></div>
  <div class="sec-head"><h2 class="sec">인기 공연</h2><a>좋아요 순 →</a></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px" id="g"></div>
</div>
<footer class="foot"><b>YuhanCon.</b> 학교 공연부터 버스킹·콘서트까지, 가까운 무대를 찾고 예매하는 공연 플랫폼<br>함께 갈 사람은 게시판에서 찾아보세요.</footer>
<div class="tag">시안 B · 카운트다운 전광판</div>
<script src="data.js"></script><script>
const days=['월','화','수','목','금','토','일'],ev={5:SHOWS[0],2:SHOWS[2]};
document.getElementById('wk').innerHTML=days.map((n,i)=>`<div class="day${ev[i]?' has':''}"><div class="dn">${n}</div><div class="dd2 num">${15+i}</div>${ev[i]?`<div class="ev">${ev[i].t}</div>`:''}</div>`).join('');
document.getElementById('g').innerHTML=[...SHOWS].sort((a,b)=>b.likes-a.likes).slice(0,3).map(TK).join('');
</script></body></html>
