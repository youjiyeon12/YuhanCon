<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('로그인')}"></head>
<body>
<a th:replace="~{fragments :: skip}"></a>
<nav th:replace="~{fragments :: nav('', false)}"></nav>

<main id="main" class="wrap page auth">
  <h1>로그인</h1>
  <p class="flash error" role="alert" th:if="${param.error}">아이디 또는 비밀번호가 맞지 않습니다. 5번 연속 틀리면 10분 동안 로그인할 수 없습니다.</p>
  <p class="flash error" role="alert" th:if="${param.locked}">로그인에 5번 실패해 10분 동안 로그인할 수 없습니다. 잠시 후 다시 시도해 주세요.</p>
  <p class="flash success" role="status" th:if="${param.signup}">가입이 완료되었습니다. 로그인해 주세요.</p>
  <p class="flash success" role="status" th:if="${param.logout}">로그아웃되었습니다.</p>
  <p class="flash info" role="status" th:if="${param.required}">로그인이 필요한 화면입니다.</p>

  <form class="form-card" th:action="@{/login}" method="post">
    <div class="field">
      <label for="loginId">아이디</label>
      <input id="loginId" name="loginId" th:value="${lastLoginId}" autocomplete="username" required maxlength="12" placeholder="영문·숫자 6~12자">
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="영문·숫자 포함 8자 이상" th:attr="autofocus=${lastLoginId != ''} ? 'autofocus'">
    </div>
    <label class="check-line"><input type="checkbox" name="remember" value="true"> 로그인 상태 유지 (14일)</label>
    <button type="submit" class="btn block">로그인</button>
    <p class="form-foot">아직 회원이 아니신가요? <a href="/signup">회원가입</a></p>
  </form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
