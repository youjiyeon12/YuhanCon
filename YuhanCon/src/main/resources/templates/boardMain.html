<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('게시판')}"></head>
<body>
<a th:replace="~{fragments :: skip}"></a>
<nav th:replace="~{fragments :: nav('board', false)}"></nav>

<main id="main" class="wrap page">
  <div class="page-head">
    <div>
      <h1>게시판</h1>
      <p class="lead">같이 갈 사람을 찾고, 공연 후기를 나눠 보세요.</p>
    </div>
    <a class="btn" href="/boardWrite">글쓰기</a>
  </div>
  <th:block th:replace="~{fragments :: flash}"></th:block>

  <p class="empty" th:if="${boardPage.isEmpty()}">아직 글이 없습니다. 첫 글을 남겨 보세요.</p>
  <div class="table-wrap" th:if="${!boardPage.isEmpty()}">
    <table class="data-table board-table">
      <thead><tr><th scope="col" class="no">번호</th><th scope="col">제목</th><th scope="col">작성자</th><th scope="col">날짜</th><th scope="col" class="no">좋아요</th><th scope="col" class="no">조회</th></tr></thead>
      <tbody>
        <tr th:each="b : ${boardPage.content}">
          <td class="no" th:text="${b.id}">1</td>
          <td class="title"><a th:href="@{/boardDetail/{id}(id=${b.id})}" th:text="${b.title}">제목</a>
            <span class="reply-count" th:if="${commentCounts[b.id] != null}" th:text="'[' + ${commentCounts[b.id]} + ']'"
                  th:attr="aria-label='댓글 ' + ${commentCounts[b.id]} + '개'">[0]</span></td>
          <td th:text="${b.member.name}">작성자</td>
          <td th:text="${#temporals.format(b.boardAt, 'yyyy.MM.dd')}">날짜</td>
          <td class="no" th:text="${b.likeCount}">0</td>
          <td class="no" th:text="${b.cnt}">0</td>
        </tr>
      </tbody>
    </table>
  </div>

  <nav class="pagination" aria-label="페이지" th:if="${boardPage.totalPages > 1}">
    <a th:if="${boardPage.hasPrevious()}" th:href="@{/boardMain(page=${boardPage.number - 1})}">이전</a>
    <a th:each="i : ${#numbers.sequence(0, boardPage.totalPages - 1)}" th:href="@{/boardMain(page=${i})}"
       th:text="${i + 1}" th:attr="aria-current=${i == boardPage.number} ? 'page'">1</a>
    <a th:if="${boardPage.hasNext()}" th:href="@{/boardMain(page=${boardPage.number + 1})}">다음</a>
  </nav>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
