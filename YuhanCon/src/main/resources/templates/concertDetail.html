<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${concert.title})}"></head>
<body>
<a th:replace="~{fragments :: skip}"></a>
<nav th:replace="~{fragments :: nav('concert', false)}"></nav>

<main id="main" class="wrap page">
  <p class="crumb"><a href="/concertList">← 공연 정보</a></p>
  <th:block th:replace="~{fragments :: flash}"></th:block>
  <p class="flash info" th:if="${!concert.approved}">승인 대기 중인 공연입니다. 관리자가 승인하면 공개되고 예매를 받을 수 있습니다.</p>

  <div class="detail">
    <div class="detail-poster">
      <img th:if="${concert.image}" th:src="${concert.image}" th:alt="${concert.title} + ' 포스터'">
      <div th:unless="${concert.image}" class="poster-empty">포스터 준비 중</div>
    </div>

    <div class="detail-info">
      <span class="badge" th:text="${concert.categoryName}">콘서트</span>
      <h1 th:text="${concert.title}">공연 제목</h1>
      <dl class="info">
        <dt>일시</dt><dd th:text="${#temporals.format(concert.date, 'yyyy. MM. dd')}">2026. 12. 20</dd>
        <dt>장소</dt><dd th:text="${concert.place}">장소</dd>
        <dt th:text="${concert.seated} ? '남은 좌석' : '남은 자리'">남은 좌석</dt>
        <dd><span th:text="${concert.availableSeats}">0</span> / <span th:text="${concert.totalSeats}">0</span><span th:text="${concert.seated} ? '석 (좌석 지정)' : '석 (자유석)'">석</span></dd>
        <dt>좋아요</dt>
        <dd>
          <form th:if="${me != null}" th:action="@{/concert/{id}/like(id=${concert.id})}" method="post" class="inline">
            <button type="submit" class="heart big" th:classappend="${liked} ? 'on'" th:attr="aria-pressed=${liked}">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.4-9.1C1.2 7.9 3.4 4.8 6.6 4.8c2 0 3.5 1.1 4.4 2.6.9-1.5 2.4-2.6 4.4-2.6 3.2 0 5.4 3.1 4 6.6-1.9 4.5-9.4 9.1-9.4 9.1z"/></svg>
              <span th:text="${concert.likeCount}">0</span><span class="sr-only">좋아요</span>
            </button>
          </form>
          <span th:if="${me == null}" th:text="${concert.likeCount}">0</span>
        </dd>
      </dl>
      <div class="prose" th:text="${concert.content}">소개</div>

      <div class="owner-actions" th:if="${canEdit}">
        <a class="btn ghost small" th:href="@{/concertEdit/{id}(id=${concert.id})}">공연 수정</a>
        <form th:action="@{/concertDelete/{id}(id=${concert.id})}" method="post" class="inline"
              data-confirm="이 공연을 삭제할까요? 되돌릴 수 없습니다.">
          <button type="submit" class="btn ghost small danger">공연 삭제</button>
        </form>
      </div>

      <!-- 예매 -->
      <section class="reserve-box" aria-labelledby="rsv-h">
        <h2 id="rsv-h" class="sr-only">예매</h2>
        <p class="state-msg" th:if="${concert.past}">종료된 공연입니다.</p>
        <p class="state-msg" th:if="${!concert.past and !concert.approved}">승인 후 예매할 수 있습니다.</p>
        <th:block th:if="${!concert.past and concert.approved}">
          <div th:if="${me == null}" class="state-msg">
            로그인하면 예매할 수 있습니다. <a class="btn small" href="/login">로그인</a>
          </div>
          <div th:if="${me != null and myReserve != null}" class="state-msg">
            <span th:text="'이미 예매한 공연입니다 (' + (${myReserve.seats != null} ? ${#strings.replace(myReserve.seats, ',', ', ')} : ${myReserve.seatCount} + '석') + ')'">이미 예매한 공연입니다</span>
            <a class="btn small" th:href="@{/reserveEdit/{id}(id=${myReserve.id})}">예매 수정</a>
            <a class="btn ghost small" href="/mypage">마이페이지</a>
          </div>
          <p class="state-msg sold" th:if="${me != null and myReserve == null and concert.soldOut}">매진되었습니다.</p>
          <form th:if="${me != null and myReserve == null and !concert.soldOut}" th:action="@{/reserve}" method="post" class="reserve-form">
            <input type="hidden" name="concertId" th:value="${concert.id}">
            <th:block th:if="${concert.seated}">
              <div th:replace="~{fragments :: seatmap(${concert}, ${taken}, ${ {} }, ${maxSeats})}"></div>
              <div class="sum">
                <p><b class="seat-summary" data-empty="좌석을 골라 주세요">좌석을 골라 주세요</b> <span class="muted">(1인 최대 <span th:text="${maxSeats}">6</span>석)</span></p>
                <button type="submit" class="btn">예매하기</button>
              </div>
            </th:block>
            <div class="sum" th:unless="${concert.seated}">
              <label class="count">매수
                <select name="seatCount">
                  <option th:each="n : ${#numbers.sequence(1, maxSeats)}" th:if="${n <= concert.availableSeats}" th:value="${n}" th:text="${n} + '석'">1석</option>
                </select>
              </label>
              <button type="submit" class="btn">예매하기</button>
            </div>
          </form>
        </th:block>
      </section>
    </div>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
