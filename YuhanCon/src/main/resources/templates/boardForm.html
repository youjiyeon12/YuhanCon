<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${board == null} ? '글쓰기' : '글 수정')}"></head>
<body>
<a th:replace="~{fragments :: skip}"></a>
<nav th:replace="~{fragments :: nav('board', false)}"></nav>

<main id="main" class="wrap page narrow">
  <h1 th:text="${board == null} ? '글쓰기' : '글 수정'">글쓰기</h1>
  <th:block th:replace="~{fragments :: flash}"></th:block>
  <form class="form-card" method="post" th:object="${form}"
        th:action="${board == null} ? @{/boardWrite} : @{/boardEdit/{id}(id=${board.id})}">
    <div class="field">
      <label for="title">제목 <span class="req" aria-hidden="true">*</span></label>
      <input id="title" th:field="*{title}" maxlength="100" required placeholder="예: 12월 20일 공연 같이 가실 분">
    </div>
    <div class="field">
      <label for="content">내용 <span class="req" aria-hidden="true">*</span></label>
      <textarea id="content" th:field="*{content}" rows="12" maxlength="5000" required placeholder="최대 5000자"></textarea>
    </div>
    <div class="form-actions">
      <a class="btn ghost" th:href="${board == null} ? '/boardMain' : @{/boardDetail/{id}(id=${board.id})}">취소</a>
      <button type="submit" class="btn" th:text="${board == null} ? '등록하기' : '수정하기'">등록하기</button>
    </div>
  </form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
