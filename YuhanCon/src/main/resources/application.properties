spring.application.name=YuhanCon

# 회원 기본키를 아이디로 바꾸면서 새 DB(~/yuhancon2)를 쓴다. 예전 DB(~/yuhancon)는 지우지 않고 남겨 두었다.
spring.datasource.url=jdbc:h2:tcp://localhost/~/yuhancon2
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# 내장 H2 콘솔은 끈다 (DB 확인은 별도 H2 콘솔 프로그램으로)
spring.h2.console.enabled=false


# 다른 사이트에서 보낸 요청에는 세션 쿠키를 붙이지 않는다
server.servlet.session.cookie.same-site=lax


#파일 용량 설정
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB



# 오류 화면에 예외 이름·메시지·스택 트레이스를 보여 주지 않는다 (spring-boot:run은 devtools가 기본값을 켜 둔다)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# 시연용 데이터: 공연이 하나도 없을 때 공연 등록자(stage01)·일반 사용자(fan0001)와 공연을 넣는다.
# 시연 계정 비밀번호는 환경변수 YUHANCON_DEMO_PASSWORD로 정하고, 없으면 시연 데이터를 넣지 않는다.
yuhancon.demo-data=true
yuhancon.demo-password=${YUHANCON_DEMO_PASSWORD:}
# 로그인 저장 쿠키 서명 키(없으면 실행할 때마다 새로 만든다)
yuhancon.remember-me-key=${YUHANCON_REMEMBER_KEY:}
